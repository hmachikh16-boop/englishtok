name: Build and publish signed Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to release; must match package.json
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - name: Validate version and signing secrets
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use stable semantic versioning (for example 1.2.3)." >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag $version does not match package.json version $package_version." >&2
            exit 1
          fi
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [[ -n "$latest_tag" ]]; then
            latest_version="${latest_tag#v}"
            if [[ ! "$latest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
              [[ "$(printf '%s\n' "$latest_version" "$version" | sort -V | tail -n 1)" == "$latest_version" &&
                "$version" != "$latest_version" ]]; then
              echo "Release version $version must be newer than the latest stable version $latest_tag." >&2
              exit 1
            fi
          fi
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              case "$name" in
                KEYSTORE_BASE64) secret_name="ANDROID_KEYSTORE_BASE64" ;;
                KEYSTORE_PASSWORD) secret_name="ANDROID_KEYSTORE_PASSWORD" ;;
                KEY_ALIAS) secret_name="ANDROID_KEY_ALIAS" ;;
                KEY_PASSWORD) secret_name="ANDROID_KEY_PASSWORD" ;;
              esac
              echo "Missing required GitHub Actions secret: $secret_name" >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build web assets
        run: |
          npm ci
          npm run lint
          npm run build
        env:
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Set Android version
        run: node scripts/set-android-release.mjs "${{ steps.release.outputs.version }}"

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/english-tok-release.keystore"
          test -s "$RUNNER_TEMP/english-tok-release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/english-tok-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK signature and create update manifest
        id: package
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "Android build tools did not provide apksigner." >&2
            exit 1
          fi
          "$apksigner_path" verify --verbose "$apk"
          named_apk="english-tok-${{ steps.release.outputs.version }}.apk"
          cp "$apk" "$named_apk"
          node scripts/create-update-manifest.mjs "${{ steps.release.outputs.version }}" "$named_apk"
          echo "apk=$named_apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "EnglishTok $RELEASE_VERSION" \
              --generate-notes
          fi
          RELEASE_NOTES="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
          RELEASE_NOTES="$RELEASE_NOTES" GITHUB_REPOSITORY="$GH_REPO" \
            node scripts/create-update-manifest.mjs "$RELEASE_VERSION" "${{ steps.package.outputs.apk }}"
          gh release upload "$RELEASE_TAG" \
            "${{ steps.package.outputs.apk }}" \
            update-manifest.json \
            --clobber

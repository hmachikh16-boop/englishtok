<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="mottle" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.005" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.64
                0 0 0 0 0.46
                0 0 0 0 0.21
                0 0 0 0.34 0"/>
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="fiber" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.19" numOctaves="3" seed="5" result="fibers"/>
      <feColorMatrix in="fibers" type="matrix"
        values="0 0 0 0 0.45
                0 0 0 0 0.32
                0 0 0 0 0.14
                0 0 0 0.11 0"/>
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="9" stitchTiles="stitch" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="light" cx="34%" cy="18%" r="72%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="0.9"/>
      <stop offset="58%" stop-color="#f7e7c4" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#caa46b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b07a37" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#b07a37" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#b07a37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e8c7"/>
      <stop offset="36%" stop-color="#f1ddb4"/>
      <stop offset="72%" stop-color="#e9d0a3"/>
      <stop offset="100%" stop-color="#ddbe89"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#base)"/>
  <rect width="1200" height="1200" fill="url(#light)"/>
  <ellipse cx="210" cy="190" rx="330" ry="240" fill="url(#stain)"/>
  <ellipse cx="1010" cy="430" rx="290" ry="360" fill="url(#stain)" opacity="0.7"/>
  <ellipse cx="560" cy="1010" rx="420" ry="240" fill="url(#stain)" opacity="0.6"/>
  <rect width="1200" height="1200" filter="url(#mottle)" opacity="0.55"/>
  <rect width="1200" height="1200" filter="url(#fiber)" opacity="0.75"/>
  <rect width="1200" height="1200" filter="url(#grain)" style="mix-blend-mode:multiply"/>
</svg>
